	<!-- Google AdSense -->
	<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7245366364935377" crossorigin="anonymous"></script>
	<script async custom-element="amp-auto-ads"
        src="https://cdn.ampproject.org/v0/amp-auto-ads-0.1.js">
	</script>
	%sveltekit.head%
	<script>
		// Anti-FOUC: apply theme before first paint (dark by default)
		(function () {
			try {
				var stored = localStorage.getItem('theme');
				var isDark = stored ? stored === 'dark' : true;
				if (isDark) document.documentElement.classList.add('dark');
			} catch (e) {
				document.documentElement.classList.add('dark');
			}
		})();
	</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<amp-auto-ads type="adsense"
        	data-ad-client="ca-pub-7245366364935377">
		</amp-auto-ads>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
